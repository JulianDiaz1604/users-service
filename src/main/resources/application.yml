server:
  port: 8081

spring:
  application:
    name: users-service
  datasource:
    url: jdbc:postgresql://localhost:5432/${DB_NAME:users}
    username: ${DB_USERNAME:plazoleta}
    password: ${DB_PASSWORD:plazoleta}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

jwt:
  # Shared HS256 secret — must match food-court-service so it can verify the same tokens.
  # Override in every environment via JWT_SECRET (min. 32 chars for HS256).
  secret: ${JWT_SECRET:change-me-plazoleta-shared-jwt-secret-key-32bytes-min}
  # Token lifetime in milliseconds (default 1 hour).
  expiration: ${JWT_EXPIRATION:3600000}

appDescription: "users-service - Plazoleta de comidas (PRAGMA)"
appVersion: "1.0.0"

# Base URL of food-court-service for restaurant ownership and employee-link calls.
# Override in every environment via FOODCOURT_BASE_URL.
foodcourt:
  base-url: ${FOODCOURT_BASE_URL:http://localhost:8080}
