name: CI (users-service)

# Runs on every PR and on pushes to main. The build FAILS (and blocks the PR) only when
# a test fails — which includes the ArchUnit architecture rules and the coverage policy.
on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # Compiles, runs all tests (ArchUnit rules + unit tests) and the JaCoCo report.
      # A boundary violation or a missing-test-suite fails here and blocks the merge.
      - name: Build & test
        run: ./gradlew build

      - name: Upload test & coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            build/reports/tests/
            build/reports/jacoco/
          if-no-files-found: ignore
